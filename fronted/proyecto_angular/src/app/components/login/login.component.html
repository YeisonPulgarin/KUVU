<div class="login-bg">
  <div class="bg-photo" [style.background-image]="'url(' + bgUrl() + ')'"></div>
  <div class="bg-overlay"></div>

  <div class="login-container">

    <!-- MARCA -->
    <div class="brand">
      <div class="brand-logo">K</div>
      <div class="brand-text">
        <span class="brand-name">KUVU</span>
        <span class="brand-tagline">GESTIÓN INTELIGENTE DE PROPIEDADES</span>
      </div>
    </div>

    <!-- CARD PRINCIPAL -->
    <div class="login-card">

      <!-- ── PASO 2: credenciales (siempre visible, empresa ya viene del landing) ── -->
      <div class="step step-creds">

        <button class="back-btn" (click)="volverAlLanding()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
          Cambiar empresa
        </button>

        <div class="empresa-badge" [style.--emp-color]="empresaSeleccionada()?.color_primario">
          <span class="badge-dot" [style.background]="empresaSeleccionada()?.color_primario"></span>
          <span class="badge-nombre">{{ empresaSeleccionada()?.nombre }}</span>
        </div>

        <div class="step-header">
          <h2 class="step-title">Ingresa tus datos</h2>
          <p class="step-desc">Usa tu correo y número de cédula</p>
        </div>

        <div class="form-group">
          <label class="field-label">Correo electrónico</label>
          <div class="field-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="M2 7l10 7 10-7"/>
            </svg>
            <input
              type="email"
              class="field-input"
              placeholder="correo@ejemplo.com"
              [ngModel]="correo()"
              (ngModelChange)="correo.set($event)"
              autocomplete="email" />
          </div>
        </div>

        <div class="form-group">
          <label class="field-label">Número de documento</label>
          <div class="field-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="4" width="18" height="16" rx="2"/>
              <circle cx="9" cy="10" r="2"/>
              <path d="M13 10h5M13 14h5M7 14h2"/>
            </svg>
            <input
              type="text"
              class="field-input"
              placeholder="Ej: 1128074279"
              [ngModel]="documento()"
              (ngModelChange)="documento.set($event)"
              (keyup.enter)="onLogin()"
              autocomplete="off" />
          </div>
        </div>

        @if (error()) {
          <div class="login-error">⚠ {{ error() }}</div>
        }

        <button class="btn-login" (click)="onLogin()" [disabled]="cargando()">
          @if (cargando()) {
            <span class="spinner"></span>
            Verificando...
          } @else {
            Ingresar al sistema
          }
        </button>

      </div>

    </div>

    <p class="footer-copy">© 2026 KUVU · YCW</p>
  </div>
</div>
