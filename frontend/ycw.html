<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: url('images/equipo/Muchachos.png') center center / cover no-repeat fixed;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(2px);
        }

        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            margin: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            background: var(--color-primario, #2C7A7B);
        }

        .logo-icon svg {
            width: 38px;
            height: 38px;
            color: white;
            stroke: white;
        }

        .logo-section h1 {
            font-size: 28px;
            font-weight: 700;
            color: white;
            margin-bottom: 6px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .logo-section p {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
        }

        .alert {
            display: none;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            color: white;
            font-size: 14px;
            align-items: center;
            gap: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: rgba(255,255,255,0.9);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: rgba(255,255,255,0.6);
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 14px 14px 44px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        .input-wrapper input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .input-wrapper input:focus {
            background: rgba(255,255,255,0.25);
            border-color: rgba(255,255,255,0.6);
            box-shadow: 0 0 0 3px rgba(255,255,255,0.1);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            letter-spacing: 0.5px;
            background: var(--color-primario, #2C7A7B);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            filter: brightness(1.1);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
        }

        .login-footer a {
            color: white;
            text-decoration: underline;
        }

        .badge-empresa {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 11px;
            color: rgba(255,255,255,0.9);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="login-wrapper">
        <div class="glass-card">
            <div class="logo-section">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <polyline points="9 22 9 12 15 12 15 22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="badge-empresa" id="badgeEmpresa">Sistema</div>
                <h1 id="nombreEmpresa">Cargando...</h1>
                <p id="sloganEmpresa">Gestión inteligente de propiedades</p>
            </div>

            <div id="alert" class="alert">
                <div class="alert-icon">⚠️</div>
                <div class="alert-message"></div>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <polyline points="22,6 12,13 2,6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <input type="email" id="email" placeholder="tu@correo.com" required autocomplete="email">
                    </div>
                </div>

                <div class="input-group">
                    <label>Documento de Identidad</label>
                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24" fill="none">
                            <rect x="5" y="11" width="14" height="10" rx="2" ry="2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="12" cy="16" r="1" fill="rgba(255,255,255,0.6)"/>
                            <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <input type="password" id="password" placeholder="Tu número de documento" required>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">
                    <span class="btn-text">Continuar</span>
                    <span class="btn-loader" style="display:none">
                        <div class="spinner"></div>
                    </span>
                </button>
            </form>

            <div class="login-footer">
                <p>¿Problemas para acceder? <a href="#">Contacta soporte</a></p>
            </div>
        </div>
    </div>

    <script>
        async function cargarConfigEmpresa() {
            try {
                const params = new URLSearchParams(window.location.search);
                const tenant = params.get('tenant');
                const url = tenant ? `/api/empresa/config?tenant=${tenant}` : '/api/empresa/config';
                const response = await fetch(url);
                if (!response.ok) return;
                const empresa = await response.json();

                document.getElementById('nombreEmpresa').textContent = empresa.nombre;
                document.getElementById('sloganEmpresa').textContent = empresa.slogan || 'Gestión inteligente de propiedades';
                document.getElementById('badgeEmpresa').textContent = empresa.subdominio || 'sistema';
                document.title = `Iniciar Sesión - ${empresa.nombre}`;

                const primario = empresa.color_primario || '#2C7A7B';
                document.documentElement.style.setProperty('--color-primario', primario);
                document.querySelector('.logo-icon').style.background = primario;
                document.querySelector('.btn-login').style.background = primario;
                if (empresa.logo_url) {
                 document.body.style.backgroundImage = `url('${empresa.logo_url}')`;
                }
                localStorage.setItem('empresaConfig', JSON.stringify(empresa));
            } catch(e) {
                document.getElementById('nombreEmpresa').textContent = 'Sistema';
            }
        }

        cargarConfigEmpresa();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alert');
            const btnLogin = document.getElementById('btnLogin');
            const btnText = btnLogin.querySelector('.btn-text');
            const btnLoader = btnLogin.querySelector('.btn-loader');

            btnText.style.display = 'none';
            btnLoader.style.display = 'block';
            btnLogin.disabled = true;
            alertBox.style.display = 'none';

            try {
                const params = new URLSearchParams(window.location.search);
                const tenant = params.get('tenant') || 'amarilo';
                localStorage.setItem('tenant', tenant);

                const response = await fetch(`/api/login?tenant=${tenant}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    if (data.usuario.rol === 'Administrador') {
                        window.location.href = `admin.html?tenant=${tenant}`;
                    } else {
                        window.location.href = `arrendatario.html?tenant=${tenant}`;
                    }
                } else {
                    throw new Error(data.error || 'Credenciales incorrectas');
                }

            } catch (error) {
                alertBox.querySelector('.alert-message').textContent = error.message;
                alertBox.style.display = 'flex';
                btnText.style.display = 'block';
                btnLoader.style.display = 'none';
                btnLogin.disabled = false;
            }
        });
    </script>
</body>
</html>
