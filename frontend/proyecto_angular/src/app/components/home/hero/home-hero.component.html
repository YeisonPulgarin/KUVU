<div class="hero-stage" appScrollProgress="exit" desktopOnly>
  <div class="container hero-inner">
    <p class="hero-brand hero-enter">KUVU.</p>
    <h1 class="hero-title display-title display-title--xl hero-enter"><app-headline [parts]="headline.parts" [title]="headline.title" /></h1>
    <p class="hero-subtitle hero-enter">
      Gestiona locales, contratos, pagos y mantenimientos de múltiples compañías
      desde un solo sistema.
    </p>
    <div class="hero-actions hero-enter">
      <a routerLink="/acceder" class="btn-primary hero-cta" appMagnetic>Ingresar</a>
      <a routerLink="/servicios" class="link-arrow hero-secondary">
        Conoce los servicios <span class="link-arrow-icon" aria-hidden="true">→</span>
      </a>
    </div>
  </div>
</div>
