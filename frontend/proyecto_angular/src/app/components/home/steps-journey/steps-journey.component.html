<div class="steps-stage" appScrollProgress="contain" desktopOnly (progressChange)="onProgress($event)">
  <div class="container steps-inner">
    <div class="steps-heading">
      <span class="section-eyebrow" aria-hidden="true">02</span>
      <h2 class="section-title">¿Cómo funciona?</h2>
      <p class="section-lead">En cuatro pasos, KUVU reemplaza tus planillas dispersas por una sola plataforma.</p>
    </div>

    <div class="steps-track">
      <span class="steps-line" aria-hidden="true"></span>
      <ol class="steps-list">
        @for (step of steps; track step.title; let i = $index) {
          <li
            class="step"
            data-reveal
            [class.is-active]="activeStep() === i"
            [attr.aria-current]="activeStep() === i ? 'step' : null"
          >
            <span class="step-number">{{ i + 1 }}</span>
            <div class="step-body">
              <h3>{{ step.title }}</h3>
              <p>{{ step.description }}</p>
            </div>
          </li>
        }
      </ol>
    </div>
  </div>
</div>
