<app-public-page
  pageTitle="Preguntas frecuentes"
  lead="Resuelve las dudas más comunes sobre KUVU. Si no encuentras la respuesta, escríbenos desde la página de contacto."
  [breadcrumb]="breadcrumb"
>
  <!-- ── FAQ completo agrupado ───────────────────────────────── -->
  <section class="faq-sections">
    <div class="container">
      @for (group of groups; track group.group; let i = $index) {
        <div class="faq-group" data-reveal>
          <span class="section-eyebrow" aria-hidden="true">{{ number(i) }}</span>
          <h2 class="faq-group-title">{{ group.group }}</h2>
          <div class="faq-list">
            @for (item of group.items; track item.q) {
              <article class="faq-item">
                <h3 class="faq-q">{{ item.q }}</h3>
                <p class="faq-a">{{ item.a }}</p>
              </article>
            }
          </div>
        </div>
      }

      <div class="faq-more" data-reveal>
        <a routerLink="/contacto" class="link-arrow">
          ¿Te quedó otra duda? Escríbenos <span class="link-arrow-icon" aria-hidden="true">→</span>
        </a>
        <a routerLink="/legal" fragment="tratamiento-datos" class="link-arrow">
          Cómo tratamos tus datos <span class="link-arrow-icon" aria-hidden="true">→</span>
        </a>
      </div>
    </div>
  </section>
</app-public-page>
