<header class="site-header">
  <div class="nav-container">

    <!-- Logo -->
    <div class="logo-area">
      <a routerLink="/" class="logo-link" aria-label="{{ brandName }}">
        <img
          [src]="isDark() ? logo.dark : logo.light"
          [alt]="brandName"
          class="logo-img logo-img--full"
        />
        <img
          [src]="isDark() ? logo.responsiveDark : logo.responsiveLight"
          [alt]="brandName"
          class="logo-img logo-img--responsive"
        />
      </a>
    </div>

    <!-- Desktop Navigation (hidden on mobile) -->
    <nav class="nav-links" aria-label="Navegación principal">
      <ng-container *ngFor="let link of navLinks()">
        <a
          *ngIf="isAnchor(link.href); else pageLinkDesktop"
          [href]="link.href"
          class="nav-item"
        >
          {{ link.label }}
        </a>
        <ng-template #pageLinkDesktop>
          <a [routerLink]="link.href" class="nav-item">{{ link.label }}</a>
        </ng-template>
      </ng-container>
    </nav>

    <!-- Desktop Actions (hidden on mobile) -->
    <div class="nav-actions">
      <a routerLink="/acceder" class="btn-primary">Ingresar</a>

      <div class="icon-group">
        <a
          class="icon-btn wa"
          [href]="whatsappLink"
          target="_blank"
          rel="noopener"
          aria-label="Escríbenos por WhatsApp"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          </svg>
        </a>
        <button
          class="icon-btn theme-toggle"
          (click)="toggleTheme()"
          [attr.aria-label]="isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
          aria-live="polite"
        >
          <svg *ngIf="!isDark()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
          <svg *ngIf="isDark()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Hamburger button (mobile only) -->
    <button
      id="hamburger-toggle"
      class="hamburger-btn"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMobileMenuOpen"
      aria-controls="mobile-menu"
      aria-label="Abrir menú"
    >
      <svg *ngIf="!isMobileMenuOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6"  x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
      <svg *ngIf="isMobileMenuOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6"  y1="6" x2="18" y2="18"/>
      </svg>
    </button>

  </div>

  <!-- Mobile Drawer -->
  <nav
    id="mobile-menu"
    class="mobile-menu"
    [class.hidden]="!isMobileMenuOpen"
    aria-label="Menú móvil"
  >
    <ng-container *ngFor="let link of navLinks()">
      <a
        *ngIf="isAnchor(link.href); else pageLinkMobile"
        [href]="link.href"
        class="nav-item"
      >
        {{ link.label }}
      </a>
      <ng-template #pageLinkMobile>
        <a [routerLink]="link.href" class="nav-item">{{ link.label }}</a>
      </ng-template>
    </ng-container>
    <div class="mobile-actions">
      <a routerLink="/acceder" class="btn-primary">Ingresar</a>
      <button
        class="btn-outline theme-toggle-mobile"
        (click)="toggleTheme()"
        [attr.aria-label]="isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
      >
        {{ isDark() ? 'Modo claro' : 'Modo oscuro' }}
      </button>
    </div>
  </nav>
</header>
