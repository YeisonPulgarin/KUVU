<div class="page-layout site-root">
  <app-site-header></app-site-header>

  <main id="contenido">
    <section class="page-hero surface-dots">
      <div class="container">
        @if (breadcrumb(); as items) {
          <app-breadcrumb [items]="items"></app-breadcrumb>
        }
        <h1 class="page-title display-title display-title--l"><app-headline [parts]="titleParts()" [title]="pageTitle()" /></h1>
        @if (lead()) {
          <p class="page-lead lead-site">{{ lead() }}</p>
        }
      </div>
    </section>

    <ng-content></ng-content>
  </main>

  <app-site-footer></app-site-footer>
</div>
