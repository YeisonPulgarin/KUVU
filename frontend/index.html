<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUVU - Gestión de Propiedades</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: url('images/kuvu/Fondo_KUVU.jpeg') center center / cover no-repeat fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
        }

        .wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            margin: 20px;
            text-align: center;
        }

        .logo-area {
            margin-bottom: 40px;
        }

        .logo-area h1 {
            font-size: 52px;
            font-weight: 800;
            color: white;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 2px 20px rgba(0,0,0,0.5);
        }

        .logo-area p {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 8px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px 36px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .glass-card h2 {
            color: white;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .glass-card p {
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            margin-bottom: 28px;
        }

        .search-wrapper {
            position: relative;
        }

        .search-wrapper svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: rgba(255,255,255,0.5);
        }

        .search-wrapper input {
            width: 100%;
            padding: 16px 16px 16px 46px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 14px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        .search-wrapper input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .search-wrapper input:focus {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.5);
        }

        .suggestions {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: rgba(15, 20, 40, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            overflow: hidden;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .suggestion-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .suggestion-dot {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
            flex-shrink: 0;
        }

        .suggestion-info {
            text-align: left;
            flex: 1;
        }

        .suggestion-info strong {
            display: block;
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        .suggestion-info span {
            color: rgba(255,255,255,0.5);
            font-size: 12px;
        }

        .suggestion-arrow {
            color: rgba(255,255,255,0.3);
            font-size: 16px;
        }

        .btn-acceder {
            width: 100%;
            padding: 16px;
            margin-top: 16px;
            background: linear-gradient(135deg, #C9A84C, #E8C97A);
            border: none;
            border-radius: 14px;
            color: #1a1a2e;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: none;
        }

        .btn-acceder:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(201, 168, 76, 0.4);
        }

        .error-msg {
            display: none;
            margin-top: 12px;
            padding: 10px 16px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 10px;
            color: rgba(255,255,255,0.9);
            font-size: 13px;
        }

        .footer-text {
            margin-top: 24px;
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="wrapper">
        <div class="logo-area">
            <h1>KUVU</h1>
            <p>Gestión inteligente de propiedades</p>
        </div>

        <div class="glass-card">
            <h2>Accede a tu empresa</h2>
            <p>Escribe el nombre de tu inmobiliaria para continuar</p>

            <div class="search-wrapper">
                <svg viewBox="0 0 24 24" fill="none">
                    <circle cx="11" cy="11" r="8" stroke-width="2" stroke-linecap="round"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <input 
                    type="text" 
                    id="busqueda" 
                    placeholder="Ej: Amarilo, Nido Rent..." 
                    autocomplete="off"
                >
                <div class="suggestions" id="suggestions"></div>
            </div>

            <button class="btn-acceder" id="btnAcceder">
                Acceder →
            </button>

            <div class="error-msg" id="errorMsg">
                ⚠️ No se encontró ninguna empresa con ese nombre
            </div>
        </div>

        <p class="footer-text">© 2025 KUVU · YCW</p>
    </div>

    <script>
        let empresas = [];
        let empresaSeleccionada = null;

        async function cargarEmpresas() {
            try {
                const response = await fetch('/api/empresas');
                empresas = await response.json();
            } catch(e) {
                console.log('Error cargando empresas:', e);
            }
        }

        const colores = ['#F5A623', '#2C7A7B', '#8B4513', '#2B4C8C'];

        function renderSuggestions(filtradas) {
            const box = document.getElementById('suggestions');
            if (filtradas.length === 0) {
                box.style.display = 'none';
                return;
            }

            box.innerHTML = filtradas.map((e, i) => `
                <div class="suggestion-item" onclick="seleccionarEmpresa('${e.subdominio}', '${e.nombre}')">
                    <div class="suggestion-dot" style="background: ${colores[i % colores.length]}">
                        ${e.nombre.charAt(0).toUpperCase()}
                    </div>
                    <div class="suggestion-info">
                        <strong>${e.nombre}</strong>
                        <span>${e.slogan || 'Gestión de propiedades'}</span>
                    </div>
                    <span class="suggestion-arrow">›</span>
                </div>
            `).join('');

            box.style.display = 'block';
        }

        function seleccionarEmpresa(subdominio, nombre) {
            empresaSeleccionada = subdominio;
            document.getElementById('busqueda').value = nombre;
            document.getElementById('suggestions').style.display = 'none';
            document.getElementById('btnAcceder').style.display = 'block';
            document.getElementById('errorMsg').style.display = 'none';
        }

        document.getElementById('busqueda').addEventListener('input', function() {
            const valor = this.value.trim().toLowerCase();
            empresaSeleccionada = null;
            document.getElementById('btnAcceder').style.display = 'none';
            document.getElementById('errorMsg').style.display = 'none';

            if (valor.length === 0) {
                document.getElementById('suggestions').style.display = 'none';
                return;
            }

            const filtradas = empresas.filter(e =>
                e.nombre.toLowerCase().includes(valor) ||
                e.subdominio.toLowerCase().includes(valor)
            );

            renderSuggestions(filtradas);

            if (filtradas.length === 0 && valor.length >= 2) {
                document.getElementById('errorMsg').style.display = 'block';
            }
        });

        document.getElementById('busqueda').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && empresaSeleccionada) {
                acceder();
            }
        });

        document.getElementById('btnAcceder').addEventListener('click', acceder);

        function acceder() {
            if (empresaSeleccionada) {
                window.location.href = `ycw.html?tenant=${empresaSeleccionada}`;
            }
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-wrapper')) {
                document.getElementById('suggestions').style.display = 'none';
            }
        });

        cargarEmpresas();
    </script>
</body>
</html>
