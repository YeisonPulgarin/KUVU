# Render Blueprint: backend de KUVU (API REST) en el plan gratuito.
# Las credenciales de la base (TiDB Cloud, compatible con MySQL) se cargan en el panel de Render (sync: false).
services:
  - type: web
    name: kuvu-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: MYSQLHOST
        sync: false
      - key: MYSQLPORT
        sync: false
      - key: MYSQLUSER
        sync: false
      - key: MYSQLPASSWORD
        sync: false
      - key: MYSQLDATABASE
        value: bd_arrendamientos
      - key: MYSQL_SSL
        value: "true"
